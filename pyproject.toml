[project]
name = "attack-range"
version = "3.1.2"
description = ""
authors = [{ name = "P4T12ICK", email = "pbareiss@splunk.com" }]
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "pydantic>=2.11,<3",
    "boto3>=1.35.27,<2",
    "azure-identity>=1.18.0,<2",
    "azure-mgmt-resource>=23.1.1,<24",
    "azure-mgmt-storage>=21.0.0",
    "attrs>=26.1.0",
    "dependency-injector>=4.49.1",
    "rich>=15.0.0",
]

[project.scripts]
attack-range = "cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "moto[s3]>=5.0,<6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that deploy real cloud infrastructure",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attack_range", "attack_range_infrastructure", "cli"]
