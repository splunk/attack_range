general:
  attack_range_password: changeme123!
  cloud_provider: gcp
  attack_range_name: ar
  ip_whitelist: 0.0.0.0/0
  description: GCP deployment with Splunk, Zeek network monitoring, and Windows endpoint monitored by Zeek
gcp:
  project_id: xxx
  region: "europe-west3"  
  zone: "europe-west3-b" 
attack_range:
- name: splunk
  image_family: "ubuntu-2204-lts"
  image_project: "ubuntu-os-cloud"
  instance_type: "e2-standard-4"
  ip_last_octet: 10
  linux: true
  user_name: ubuntu
  roles:
  - role: P4T12ICK.ludus_ar_splunk
    vars:
      ludus_ar_splunk_url: https://download.splunk.com/products/splunk/releases/10.2.2/linux/splunk-10.2.2-80b90d638de6-linux-amd64.tgz
      ludus_ar_splunk_password: changeme123!
- name: zeek
  image_family: "ubuntu-2204-lts"
  image_project: "ubuntu-os-cloud"
  instance_type: "e2-standard-4"
  ip_last_octet: 11
  zeek: true
  linux: true
  user_name: ubuntu
  roles:
  - role: P4T12ICK.ludus_ar_zeek
    vars:
      ludus_ar_zeek_splunk_password: changeme123!
      ludus_ar_zeek_splunk_ip: 10.0.2.10
- name: win
  image_family: "windows-2022"
  image_project: "windows-cloud"
  instance_type: "e2-standard-2"
  ip_last_octet: 12
  windows: true
  user_name: Administrator
  zeek_monitor: true
  roles:
  - role: P4T12ICK.ludus_ar_windows
    vars:
      ludus_ar_windows_password: changeme123!
      ludus_ar_windows_splunk_ip: 10.0.2.10