  ip_last_octet: 21
  user_name: admin
  root_volume_size: 120
  reg_key: cisco
  nat_id: cisco
- name: win
  ami_name_filter: Windows_Server-2022-English-Full-Base-*
  ami_owner: "801119661308"
  instance_type: t3.large
  ip_last_octet: 11
