  ami_product_code: 7lgvy7mt78lgoi4lant0znp5h
  instance_type: t3.large
  ip_last_octet: 12
  linux: true
  user_name: kali
  roles:
  - role: P4T12ICK.ar_kali
    vars:
      ar_kali_password: s3cr3t!
      ar_kali_metasploit_rpc_password: changeme123!