apiVersion: v0.1
kind: Server
metadata:
  name: win
spec:
  network: ar
  access:
    username: Administrator
    password: $PASSWORD$
    winrm:
      port: 5985
      scheme: http
      transport: basic
      certValidation: ignore
      timeoutSeconds: 600
  provisioning:
    - type: ansible
      repository: https://github.com/splunk/attack_range
      revision: ar_v6
      rolePath: ansible_roles/attack_range_windows
      vars:
        attack_range_windows_password: $PASSWORD$
        attack_range_windows_splunk_ip: 10.0.2.10
        attack_range_windows_uf_url: https://download.splunk.com/products/universalforwarder/releases/10.6.2.5/windows/splunkforwarder-10.6.2.5-b07ce3b48d58-windows-x64.msi
  interfaces:
    - name: eth0
      segment: mgmt
      address: 10.0.2.11
