apiVersion: v0.1
kind: ServerBinding
metadata:
  name: splunk-aws
spec:
  server: splunk
  provider: aws
  location: eu-west-2
  realize:
    server: instance
    interface: network-interface
    public: elastic-ip
  aws:
    instanceType: t3.xlarge
    ami_name_filter: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
    ami_owner: 099720109477
    rootVolume:
      sizeGiB: 60
      type: gp3
