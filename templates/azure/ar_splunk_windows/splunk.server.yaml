apiVersion: v0.1
kind: Server
metadata:
  name: splunk
spec:
  network: ar
  access:
    username: ubuntu
  provisioning:
    - type: ansible
      role: P4T12ICK.ludus_ar_splunk
      vars:
        ludus_ar_splunk_url: https://download.splunk.com/products/splunk/releases/10.2.2/linux/splunk-10.2.2-80b90d638de6-linux-amd64.tgz
        ludus_ar_splunk_password: $PASSWORD$
  interfaces:
    - name: eth0
      segment: mgmt
      address: 10.0.2.10
