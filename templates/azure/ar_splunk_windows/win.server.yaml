apiVersion: v0.1
kind: Server
metadata:
  name: win
spec:
  network: ar
  access:
    username: AzureAdmin
    password: $PASSWORD$
    winrm:
      port: 5985
      scheme: http
      transport: basic
      certValidation: ignore
      timeoutSeconds: 600
  provisioning:
    - type: ansible
      role: P4T12ICK.ludus_ar_windows
      vars:
        ludus_ar_windows_password: $PASSWORD$
        ludus_ar_windows_splunk_ip: 10.0.2.10
  interfaces:
    - name: eth0
      segment: mgmt
      address: 10.0.2.11
