apiVersion: v0.1
kind: ServerBinding
metadata:
  name: ftd-azure
spec:
  server: ftd
  provider: azure
  location: westeurope
  realize:
    server: virtual-machine
    interface: network-interface
    public: public-ip
  azure:
    size: Standard_D3_v2
    imageId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/images/providers/Microsoft.Compute/images/cisco-ftd
    osDisk:
      sizeGiB: 127
      storageAccountType: StandardSSD_LRS
