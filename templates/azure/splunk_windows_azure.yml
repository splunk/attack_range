general:
  attack_range_password: changeme123!
  cloud_provider: azure
  attack_range_name: ar
  ip_whitelist: 0.0.0.0/0
  description: Azure deployment with Splunk and Windows endpoint for testing Windows-based attacks
azure:
  location: West Europe
  subscription_id: xxx
attack_range:
- name: splunk
  image_publisher: canonical
  image_offer: 0001-com-ubuntu-server-jammy
  image_sku: 22_04-lts
  instance_type: Standard_D4s_v3
  ip_last_octet: 10
  linux: true
  user_name: ubuntu
  roles:
  - role: P4T12ICK.ludus_ar_splunk
    vars:
      ludus_ar_splunk_url: https://download.splunk.com/products/splunk/releases/10.2.2/linux/splunk-10.2.2-80b90d638de6-linux-amd64.tgz
      ludus_ar_splunk_password: changeme123!
  - role: P4T12ICK.ar_guacamole
    vars:
      ar_guacamole_password: changeme123!
      ar_guacamole_servers:
        - name: splunk
          protocol: ssh
          hostname: 10.0.2.10
          port: 22
          username: ubuntu
          password: changeme123!
        - name: windows_server
          protocol: rdp
          hostname: 10.0.2.11
          port: 3389
          username: Administrator
          password: changeme123!
- name: win
  image_publisher: MicrosoftWindowsServer
  image_offer: WindowsServer
  image_sku: 2022-datacenter
  instance_type: Standard_D2s_v3
  ip_last_octet: 11
  windows: true
  user_name: AzureAdmin
  roles:
  - role: P4T12ICK.ludus_ar_windows
    vars:
      ludus_ar_windows_password: changeme123!
      ludus_ar_windows_splunk_ip: 10.0.2.10
