# Machine settings for the WireGuard gateway on AWS. location is replaced by the range.
apiVersion: v0.1
kind: ServerBinding
metadata:
  name: wireguard-aws
spec:
  server: wireguard
  provider: aws
  location: range
  realize:
    server: instance
    interface: network-interface
    public: elastic-ip
  aws:
    instanceType: t3.small
    ami_name_filter: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
    ami_owner: "099720109477"
    rootVolume:
      sizeGiB: 30
      type: gp3
