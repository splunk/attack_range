---
- name: Resolve FMC management address
  ansible.builtin.set_fact:
    ar_cisco_fmc_host: "{{ inventory_hostname }}"
  when: ar_cisco_fmc_host is not defined or ar_cisco_fmc_host | length == 0

- name: Wait for FMC REST API (first boot can take 30-45 minutes)
  ansible.builtin.uri:
    url: "https://{{ ar_cisco_fmc_host }}:{{ ar_cisco_fmc_port }}/api/fmc_platform/v1/auth/generatetoken"
    method: POST
    user: "{{ ar_cisco_fmc_user }}"
    password: "{{ ar_cisco_fmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ ar_cisco_fmc_validate_certs }}"
    status_code: [200, 204]
    timeout: 30
  register: ar_cisco_fmc_auth
  until: ar_cisco_fmc_auth.status in [200, 204]
  retries: "{{ ar_cisco_fmc_api_retries }}"
  delay: "{{ ar_cisco_fmc_api_delay }}"
  no_log: true

- name: Capture FMC API session
  ansible.builtin.set_fact:
    ar_cisco_fmc_token: "{{ ar_cisco_fmc_auth.x_auth_access_token | default(ar_cisco_fmc_auth.headers['X-auth-access-token']) }}"
    ar_cisco_fmc_domain: "{{ ar_cisco_fmc_auth.domain_uuid | default(ar_cisco_fmc_auth.headers['DOMAIN_UUID']) }}"

- name: Configure FMC audit log export to syslog
  ansible.builtin.include_tasks: audit_syslog.yml
  when: ar_cisco_fmc_syslog_host | default('') | length > 0

- name: Configure Integrations/Splunk event export
  ansible.builtin.include_tasks: splunk_profile.yml
  when:
    - ar_cisco_fmc_syslog_host | default('') | length > 0
    - ar_cisco_fmc_ftd_mgmt_ip | length == 0

- name: Register FTD and deploy its policy
  ansible.builtin.include_tasks: ftd_register.yml
  when: ar_cisco_fmc_ftd_mgmt_ip | length > 0
