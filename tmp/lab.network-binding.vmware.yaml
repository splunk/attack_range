apiVersion: v0.1
kind: NetworkBinding
metadata:
  name: lab-vmware
spec:
  network: lab
  provider: vmware
  location: site-1
  realize:
    network: existing
    segment: port-group
    internet: existing
    nat: existing
    filter: existing
  vmware:
    datacenter: dc1
    segments:
      subnet-1:
        portGroup: pg-edge
      subnet-2:
        portGroup: pg-app
