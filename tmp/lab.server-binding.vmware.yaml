apiVersion: v0.1
kind: ServerBinding
metadata:
  name: app-1-vmware
spec:
  server: app-1
  provider: vmware
  location: site-1
  realize:
    server: virtual-machine
    interface: nic
  vmware:
    cluster: cluster-1
    datastore: ds-1
    template: ubuntu-24.04
    cpu: 2
    memoryMiB: 4096
    disk:
      sizeGiB: 30
