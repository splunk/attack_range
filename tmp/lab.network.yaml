apiVersion: v0.1
kind: Network
metadata:
  name: lab
spec:
  addressSpace:
    cidr: 10.0.0.0/16

  zones:
    - name: edge
      exposure: internet
    - name: app
      exposure: private

  segments:
    - name: subnet-1
      zone: edge
      cidr: 10.0.0.0/24
      filters:
        - ssh
    - name: subnet-2
      zone: app
      cidr: 10.0.1.0/24

  gateways:
    - name: internet
      type: internet
      attach: subnet-1
    - name: egress
      type: nat
      attach: subnet-1
      serves: 
        - subnet-2

  reachability:
    - from: subnet-2
      to: internet
      via: egress

  perimeter:
    sources:
      - 203.0.113.10/32

  filters:
    - name: ssh
      rules:
        - direction: ingress
          protocol: tcp
          ports: [22]
          sources:
            - 0.0.0.0/0
        - direction: egress
          protocol: any
          destinations:
            - 0.0.0.0/0
