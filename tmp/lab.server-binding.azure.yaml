apiVersion: v0.1
kind: ServerBinding
metadata:
  name: app-1-azure
spec:
  server: app-1
  provider: azure
  location: westeurope
  realize:
    server: virtual-machine
    interface: network-interface
    public: public-ip
  azure:
    size: Standard_B2s
    image:
      publisher: Canonical
      offer: ubuntu-24_04-lts
      sku: server
      version: latest
    osDisk:
      sizeGiB: 30
      storageAccountType: Premium_LRS
