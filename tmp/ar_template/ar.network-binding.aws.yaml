apiVersion: v0.1
kind: NetworkBinding
metadata:
  name: ar-aws
spec:
  network: ar
  provider: aws
  location: eu-west-2
  tags:
    splunkit_environment_type: non-prd
    splunkit_data_classification: private
  realize:
    network: vpc
    segment: subnet
    internet: internet-gateway
    nat: nat-gateway
    filter: security-group
  aws:
    availabilityZone: eu-central-1a
