apiVersion: v0.1
kind: Server
metadata:
  name: splunk
spec:
  network: ar
  access:
    username: ubuntu
    authorizedKeys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAttackRangeKeySuppliedAtBuild
  provisioning:
    - type: ansible
      role: P4T12ICK.ludus_ar_splunk
      vars:
        ludus_ar_splunk_url: https://download.splunk.com/products/splunk/releases/10.2.2/linux/splunk-10.2.2-80b90d638de6-linux-amd64.tgz
        ludus_ar_splunk_password: changeme123!
    - type: ansible
      role: P4T12ICK.ar_guacamole
      vars:
        ar_guacamole_password: changeme123!
        ar_guacamole_servers:
          - name: splunk
            protocol: ssh
            hostname: 10.0.2.10
            port: 22
            username: ubuntu
            password: changeme123!
          - name: windows_server
            protocol: rdp
            hostname: 10.0.2.11
            port: 3389
            username: Administrator
            password: changeme123!
  interfaces:
    - name: eth0
      segment: mgmt
      address: 10.0.2.10
