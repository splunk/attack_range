apiVersion: v0.1
kind: Server
metadata:
  name: app-1
spec:
  network: lab
  access:
    username: ubuntu
    authorizedKeys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyForLabSpecOnly
  bootstrap:
    userData: app-1.ps1
  provisioning:
    - type: ansible
      role: P4T12ICK.common
      vars:
        common_username: ubuntu
        common_authorizedKeys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyForLabSpecOnly
    - type: python
      source: local
      file: configure.py
    - type: python
      source: remote
      url: https://example.com/setup.py
  interfaces:
    - name: eth0
      segment: subnet-2
      address: 10.0.1.10
      filters:
        - ssh
